[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "territory-optimisation-api"
version = "1.0.0"
description = "Async Google Sheets API for the Territory Optimisation Engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-run>=0.10,<1",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "territory-optimisation-engine @ git+https://github.com/5d7/territory-optimisation-engine.git@91aacf817a8c94f338c1bd508079c6e83581fb6a",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]
dev = [
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
territory-api = "territory_api.api:main"
territory-worker = "territory_api.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
strict = true
